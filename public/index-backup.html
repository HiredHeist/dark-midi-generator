<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dark MIDI Generator</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #a855f7;
            border-radius: 4px;
        }
        /* Custom range slider */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #a855f7;
            cursor: pointer;
            border-radius: 50%;
        }
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #a855f7;
            cursor: pointer;
            border-radius: 50%;
            border: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // Lucide React icons as inline SVGs
        const Music = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
            </svg>
        );

        const AlertCircle = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const Download = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
        );

        const Loader2 = ({ className = "w-6 h-6" }) => (
            <svg className={className + " animate-spin"} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
            </svg>
        );

        const Play = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const Pause = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const RotateCw = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
        );

        const Volume2 = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
            </svg>
        );

        function MIDIStemGenerator() {
            const [genre, setGenre] = useState('doom-metal');
            const [bpm, setBpm] = useState(80);
            const [prompt, setPrompt] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [generatedStems, setGeneratedStems] = useState(null);
            const [error, setError] = useState('');
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);
            const [remakingStems, setRemakingStems] = useState(new Set());
            const [mutedStems, setMutedStems] = useState(new Set());
            
            const audioContextRef = useRef(null);
            const oscillatorsRef = useRef([]);
            const startTimeRef = useRef(0);
            const animationFrameRef = useRef(null);

            const genres = [
                { id: 'doom-metal', name: 'Doom Metal', description: 'Heavy, slow riffs with crushing bass' },
                { id: 'industrial', name: 'Industrial', description: 'Mechanical rhythms and distorted synths' },
                { id: 'dungeon-synth', name: 'Dungeon Synth', description: 'Dark atmospheric medieval soundscapes' }
            ];

            useEffect(() => {
                return () => {
                    stopPlayback();
                    if (audioContextRef.current) {
                        audioContextRef.current.close();
                    }
                };
            }, []);

            const noteToMidi = (note) => {
                const notes = { 'C': 0, 'C#': 1, 'D': 2, 'D#': 3, 'E': 4, 'F': 5, 'F#': 6, 'G': 7, 'G#': 8, 'A': 9, 'A#': 10, 'B': 11 };
                const match = note.match(/([A-G]#?)(\d)/);
                if (!match) return 60;
                const [, noteName, octave] = match;
                return (parseInt(octave) + 1) * 12 + notes[noteName];
            };

            const midiToFrequency = (midi) => {
                return 440 * Math.pow(2, (midi - 69) / 12);
            };

            const calculateDuration = (stems) => {
                let maxTime = 0;
                stems.forEach(stem => {
                    stem.notes.forEach(note => {
                        const endTime = note.time + note.duration;
                        if (endTime > maxTime) maxTime = endTime;
                    });
                });
                return maxTime * (60 / bpm);
            };

            const initAudioContext = () => {
                if (!audioContextRef.current) {
                    audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)();
                }
                return audioContextRef.current;
            };

            const playNote = (frequency, startTime, duration, velocity, stemIndex) => {
                if (mutedStems.has(stemIndex)) return;
                
                const audioContext = audioContextRef.current;
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                const stemName = generatedStems[stemIndex].name.toLowerCase();
                if (stemName.includes('bass')) {
                    oscillator.type = 'sawtooth';
                } else if (stemName.includes('guitar') || stemName.includes('riff')) {
                    oscillator.type = 'square';
                } else if (stemName.includes('pad') || stemName.includes('synth')) {
                    oscillator.type = 'sine';
                } else {
                    oscillator.type = 'triangle';
                }
                
                oscillator.frequency.setValueAtTime(frequency, startTime);
                
                const normalizedVelocity = (velocity || 100) / 127;
                gainNode.gain.setValueAtTime(0, startTime);
                gainNode.gain.linearRampToValueAtTime(normalizedVelocity * 0.3, startTime + 0.01);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + duration);
                
                return { oscillator, gainNode };
            };

            const playStems = () => {
                const audioContext = initAudioContext();
                const currentAudioTime = audioContext.currentTime;
                const beatsPerSecond = bpm / 60;
                
                oscillatorsRef.current = [];
                
                generatedStems.forEach((stem, stemIndex) => {
                    stem.notes.forEach(note => {
                        const startTime = currentAudioTime + (note.time / beatsPerSecond);
                        const duration = note.duration / beatsPerSecond;
                        const frequency = midiToFrequency(noteToMidi(note.pitch));
                        
                        const nodes = playNote(frequency, startTime, duration, note.velocity, stemIndex);
                        if (nodes) {
                            oscillatorsRef.current.push(nodes);
                        }
                    });
                });
                
                startTimeRef.current = Date.now();
                updatePlaybackTime();
            };

            const updatePlaybackTime = () => {
                const elapsed = (Date.now() - startTimeRef.current) / 1000;
                setCurrentTime(elapsed);
                
                if (elapsed >= duration) {
                    stopPlayback();
                    setCurrentTime(0);
                } else {
                    animationFrameRef.current = requestAnimationFrame(updatePlaybackTime);
                }
            };

            const stopPlayback = () => {
                oscillatorsRef.current.forEach(({ oscillator }) => {
                    try {
                        oscillator.stop();
                    } catch (e) {
                        // Already stopped
                    }
                });
                oscillatorsRef.current = [];
                
                if (animationFrameRef.current) {
                    cancelAnimationFrame(animationFrameRef.current);
                }
                
                setIsPlaying(false);
                setCurrentTime(0);
            };

            const togglePlayback = () => {
                if (isPlaying) {
                    stopPlayback();
                } else {
                    setIsPlaying(true);
                    playStems();
                }
            };

            const toggleMuteStem = (index) => {
                setMutedStems(prev => {
                    const newMuted = new Set(prev);
                    if (newMuted.has(index)) {
                        newMuted.delete(index);
                    } else {
                        newMuted.add(index);
                    }
                    return newMuted;
                });
            };

            const createMIDIFile = (stemData) => {
                const tracks = [];
                
                stemData.forEach(stem => {
                    const track = {
                        name: stem.name,
                        notes: stem.notes.map(note => ({
                            midi: noteToMidi(note.pitch),
                            time: note.time,
                            duration: note.duration,
                            velocity: note.velocity || 100
                        }))
                    };
                    tracks.push(track);
                });

                const header = createMIDIHeader(tracks.length);
                const trackData = tracks.map(track => createMIDITrack(track, bpm));
                
                return new Blob([header, ...trackData], { type: 'audio/midi' });
            };

            const createMIDIHeader = (numTracks) => {
                const header = new Uint8Array(14);
                header.set([0x4D, 0x54, 0x68, 0x64], 0);
                header.set([0x00, 0x00, 0x00, 0x06], 4);
                header.set([0x00, 0x01], 8);
                header.set([numTracks >> 8, numTracks & 0xFF], 10);
                header.set([0x01, 0xE0], 12);
                return header;
            };

            const createMIDITrack = (track, bpm) => {
                const events = [];
                const ticksPerBeat = 480;
                
                const nameBytes = new TextEncoder().encode(track.name);
                events.push([0x00, 0xFF, 0x03, nameBytes.length, ...nameBytes]);
                
                const microsecondsPerBeat = Math.round(60000000 / bpm);
                events.push([0x00, 0xFF, 0x51, 0x03, 
                    (microsecondsPerBeat >> 16) & 0xFF,
                    (microsecondsPerBeat >> 8) & 0xFF,
                    microsecondsPerBeat & 0xFF
                ]);
                
                track.notes.forEach(note => {
                    const startTick = Math.round(note.time * ticksPerBeat);
                    const duration = Math.round(note.duration * ticksPerBeat);
                    
                    events.push([startTick, 0x90, note.midi, note.velocity]);
                    events.push([startTick + duration, 0x80, note.midi, 0]);
                });
                
                events.sort((a, b) => a[0] - b[0]);
                let lastTime = 0;
                const deltaEvents = events.map(event => {
                    const deltaTime = event[0] - lastTime;
                    lastTime = event[0];
                    return [deltaTime, ...event.slice(1)];
                });
                
                deltaEvents.push([0x00, 0xFF, 0x2F, 0x00]);
                
                const trackBytes = [];
                deltaEvents.forEach(event => {
                    trackBytes.push(...encodeVariableLength(event[0]));
                    trackBytes.push(...event.slice(1));
                });
                
                const result = new Uint8Array(8 + trackBytes.length);
                result.set([0x4D, 0x54, 0x72, 0x6B], 0);
                const len = trackBytes.length;
                result.set([len >> 24, (len >> 16) & 0xFF, (len >> 8) & 0xFF, len & 0xFF], 4);
                result.set(trackBytes, 8);
                
                return result;
            };

            const encodeVariableLength = (value) => {
                const bytes = [];
                bytes.push(value & 0x7F);
                value >>= 7;
                while (value > 0) {
                    bytes.unshift((value & 0x7F) | 0x80);
                    value >>= 7;
                }
                return bytes;
            };

            const generateStems = async () => {
                if (!prompt.trim()) {
                    setError('Please enter a prompt describing your music');
                    return;
                }

                setIsGenerating(true);
                setError('');
                setGeneratedStems(null);
                stopPlayback();

                try {
                    const response = await fetch('/api/generate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            genre,
                            bpm,
                            prompt
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || 'Failed to generate stems');
                    }

                    const data = await response.json();
                    setGeneratedStems(data.stems);
                    setDuration(calculateDuration(data.stems));
                    setMutedStems(new Set());

                } catch (err) {
                    setError(err.message || 'Failed to generate MIDI stems');
                } finally {
                    setIsGenerating(false);
                }
            };

            const remakeStem = async (stemIndex) => {
                setRemakingStems(prev => new Set(prev).add(stemIndex));
                
                try {
                    const stem = generatedStems[stemIndex];
                    
                    const response = await fetch('/api/remake', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            genre,
                            bpm,
                            prompt,
                            stemName: stem.name
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || 'Failed to remake stem');
                    }

                    const data = await response.json();
                    
                    setGeneratedStems(prev => {
                        const updated = [...prev];
                        updated[stemIndex] = data.stem;
                        return updated;
                    });
                    
                    const updatedStems = [...generatedStems];
                    updatedStems[stemIndex] = data.stem;
                    setDuration(calculateDuration(updatedStems));
                    
                } catch (err) {
                    setError(`Failed to remake ${generatedStems[stemIndex].name}: ${err.message}`);
                } finally {
                    setRemakingStems(prev => {
                        const updated = new Set(prev);
                        updated.delete(stemIndex);
                        return updated;
                    });
                }
            };

            const downloadMIDI = () => {
                if (!generatedStems) return;
                
                const midiBlob = createMIDIFile(generatedStems);
                const url = URL.createObjectURL(midiBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${genre}-${bpm}bpm-${Date.now()}.mid`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const downloadStem = (stem, index) => {
                const midiBlob = createMIDIFile([stem]);
                const url = URL.createObjectURL(midiBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${stem.name.replace(/\s+/g, '-')}-${index}.mid`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-gray-900 via-purple-900 to-black text-gray-100 p-4 sm:p-8">
                    <div className="max-w-4xl mx-auto">
                        <div className="text-center mb-6 sm:mb-8">
                            <div className="flex items-center justify-center gap-3 mb-4">
                                <Music className="w-10 h-10 sm:w-12 sm:h-12 text-purple-400" />
                                <h1 className="text-3xl sm:text-4xl font-bold">Dark MIDI Generator</h1>
                            </div>
                            <p className="text-sm sm:text-base text-gray-400">AI-powered MIDI stem generation for doom metal, industrial, and dungeon synth</p>
                        </div>

                        <div className="bg-gray-800 rounded-lg p-4 sm:p-6 shadow-2xl border border-purple-500/20 mb-4 sm:mb-6">
                            <div className="space-y-4 sm:space-y-6">
                                <div>
                                    <label className="block text-sm font-semibold mb-3 text-purple-300">Genre</label>
                                    <div className="grid grid-cols-1 gap-3">
                                        {genres.map(g => (
                                            <button
                                                key={g.id}
                                                onClick={() => setGenre(g.id)}
                                                className={`p-4 rounded-lg border-2 transition-all text-left ${
                                                    genre === g.id
                                                        ? 'border-purple-500 bg-purple-500/20'
                                                        : 'border-gray-700 bg-gray-900/50 active:border-purple-500/50'
                                                }`}
                                            >
                                                <div className="font-semibold">{g.name}</div>
                                                <div className="text-xs text-gray-400 mt-1">{g.description}</div>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-semibold mb-3 text-purple-300">
                                        BPM: <span className="text-white text-lg">{bpm}</span>
                                    </label>
                                    <input
                                        type="range"
                                        min="40"
                                        max="180"
                                        value={bpm}
                                        onChange={(e) => setBpm(parseInt(e.target.value))}
                                        className="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-purple-500"
                                    />
                                    <div className="flex justify-between text-xs text-gray-500 mt-1">
                                        <span>40</span>
                                        <span>180</span>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-semibold mb-3 text-purple-300">
                                        Describe Your Track
                                    </label>
                                    <textarea
                                        value={prompt}
                                        onChange={(e) => setPrompt(e.target.value)}
                                        placeholder="e.g., Crushing riff in E tuning with haunting melody..."
                                        className="w-full h-32 px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-purple-500 text-white placeholder-gray-500 text-sm sm:text-base"
                                    />
                                </div>

                                {error && (
                                    <div className="bg-red-900/30 border border-red-500 rounded-lg p-4 flex items-start gap-3">
                                        <AlertCircle className="w-5 h-5 text-red-400 flex-shrink-0 mt-0.5" />
                                        <span className="text-sm text-red-200">{error}</span>
                                    </div>
                                )}

                                <button
                                    onClick={generateStems}
                                    disabled={isGenerating}
                                    className="w-full bg-purple-600 active:bg-purple-700 disabled:bg-gray-700 disabled:cursor-not-allowed text-white font-bold py-4 rounded-lg transition-colors flex items-center justify-center gap-2"
                                >
                                    {isGenerating ? (
                                        <>
                                            <Loader2 className="w-5 h-5" />
                                            <span className="text-sm sm:text-base">Generating Stems...</span>
                                        </>
                                    ) : (
                                        <>
                                            <Music className="w-5 h-5" />
                                            <span className="text-sm sm:text-base">Generate MIDI Stems</span>
                                        </>
                                    )}
                                </button>
                            </div>
                        </div>

                        {generatedStems && (
                            <div className="space-y-4">
                                <div className="bg-gray-800 rounded-lg p-4 sm:p-6 shadow-2xl border border-purple-500/20">
                                    <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
                                        <h2 className="text-xl sm:text-2xl font-bold">Preview & Download</h2>
                                        <button
                                            onClick={downloadMIDI}
                                            className="bg-green-600 active:bg-green-700 text-white px-3 sm:px-4 py-2 rounded-lg flex items-center gap-2 transition-colors text-sm sm:text-base"
                                        >
                                            <Download className="w-4 h-4" />
                                            Download All
                                        </button>
                                    </div>
                                    
                                    <div className="flex items-center gap-3 sm:gap-4 mb-4">
                                        <button
                                            onClick={togglePlayback}
                                            className="bg-purple-600 active:bg-purple-700 text-white p-3 sm:p-4 rounded-full transition-colors flex-shrink-0"
                                        >
                                            {isPlaying ? <Pause className="w-5 h-5 sm:w-6 sm:h-6" /> : <Play className="w-5 h-5 sm:w-6 sm:h-6" />}
                                        </button>
                                        
                                        <div className="flex-1">
                                            <div className="bg-gray-700 rounded-full h-2 overflow-hidden">
                                                <div 
                                                    className="bg-purple-500 h-full transition-all duration-100"
                                                    style={{ width: `${(currentTime / duration) * 100}%` }}
                                                />
                                            </div>
                                            <div className="flex justify-between text-xs text-gray-400 mt-1">
                                                <span>{formatTime(currentTime)}</span>
                                                <span>{formatTime(duration)}</span>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <p className="text-xs sm:text-sm text-gray-400">
                                        Click play to preview. Download MIDI files to use in your DAW for full quality.
                                    </p>
                                </div>

                                <div className="bg-gray-800 rounded-lg p-4 sm:p-6 shadow-2xl border border-purple-500/20">
                                    <h3 className="text-lg sm:text-xl font-bold mb-4">Individual Stems</h3>
                                    <div className="space-y-3">
                                        {generatedStems.map((stem, index) => (
                                            <div key={index} className="bg-gray-900 rounded-lg p-3 sm:p-4">
                                                <div className="flex items-start justify-between gap-2 mb-2">
                                                    <div className="flex items-start gap-2 sm:gap-3 flex-1">
                                                        <button
                                                            onClick={() => toggleMuteStem(index)}
                                                            className={`p-2 rounded transition-colors flex-shrink-0 ${
                                                                mutedStems.has(index)
                                                                    ? 'bg-gray-700 text-gray-500'
                                                                    : 'bg-purple-600 text-white'
                                                            }`}
                                                            title={mutedStems.has(index) ? 'Unmute' : 'Mute'}
                                                        >
                                                            <Volume2 className="w-4 h-4" />
                                                        </button>
                                                        <div className="flex-1 min-w-0">
                                                            <div className="font-semibold text-sm sm:text-lg truncate">{stem.name}</div>
                                                            <div className="text-xs sm:text-sm text-gray-400">{stem.notes.length} notes</div>
                                                        </div>
                                                    </div>
                                                </div>
                                                
                                                <div className="flex gap-2 mt-2">
                                                    <button
                                                        onClick={() => remakeStem(index)}
                                                        disabled={remakingStems.has(index)}
                                                        className="flex-1 bg-orange-600 active:bg-orange-700 disabled:bg-gray-700 disabled:cursor-not-allowed text-white px-2 sm:px-3 py-2 rounded-lg flex items-center justify-center gap-2 transition-colors text-xs sm:text-sm"
                                                    >
                                                        {remakingStems.has(index) ? (
                                                            <>
                                                                <Loader2 className="w-3 h-3 sm:w-4 sm:h-4" />
                                                                <span className="hidden sm:inline">Remaking...</span>
                                                            </>
                                                        ) : (
                                                            <>
                                                                <RotateCw className="w-3 h-3 sm:w-4 sm:h-4" />
                                                                Remake
                                                            </>
                                                        )}
                                                    </button>
                                                    <button
                                                        onClick={() => downloadStem(stem, index)}
                                                        className="flex-1 bg-purple-600 active:bg-purple-700 text-white px-2 sm:px-3 py-2 rounded-lg flex items-center justify-center gap-2 transition-colors text-xs sm:text-sm"
                                                    >
                                                        <Download className="w-3 h-3 sm:w-4 sm:h-4" />
                                                        Download
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<MIDIStemGenerator />, document.getElementById('root'));
    </script>
</body>
</html>
