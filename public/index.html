<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark MIDI - Ultimate</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; overflow-x: hidden; transition: background 0.3s; color: white; }
        .theme-dark { background: linear-gradient(to bottom right, #1a1a2e, #16213e, #0f3460); }
        .theme-doom { background: linear-gradient(to bottom right, #4a0000, #2d0000, #1a0000); }
        .theme-industrial { background: linear-gradient(to bottom right, #1a1a1a, #2d2d2d, #0a0a0a); }
        .theme-dungeon { background: linear-gradient(to bottom right, #1a0b3d, #2d1b69, #0f0529); }
        * { color: white; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(#a855f7, #ec4899); border-radius: 5px; }
        input[type="range"] { -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 24px; height: 24px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            cursor: pointer; border-radius: 50%; box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }
        .glow { box-shadow: 0 0 20px rgba(168, 85, 247, 0.3); }
        .waveform { height: 50px; display: flex; align-items: flex-end; gap: 2px; padding: 4px; }
        .waveform-bar { width: 3px; background: linear-gradient(to top, #a855f7, #ec4899); border-radius: 2px; }
    </style>
</head>
<body class="theme-dark text-white">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const Music = ({ className = "w-6 h-6" }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" /></svg>;
        const Play = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /></svg>;
        const Pause = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 9v6m4-6v6" /></svg>;
        const Download = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>;
        const RotateCw = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>;
        const Loader2 = ({ className }) => <svg className={className + " animate-spin"} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" /></svg>;
        const Save = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>;
        const Mic = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" /></svg>;
        const Palette = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" /></svg>;

        function App() {
            const [genre, setGenre] = useState('doom-metal');
            const [bpm, setBpm] = useState(80);
            const [key, setKey] = useState('D');
            const [scale, setScale] = useState('minor');
            const [prompt, setPrompt] = useState('');
            const [song, setSong] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [playing, setPlaying] = useState(null);
            const [theme, setTheme] = useState('dark');
            const [projects, setProjects] = useState([]);
            const [showProjects, setShowProjects] = useState(false);
            const [selected, setSelected] = useState({});
            const [dynamics, setDynamics] = useState({});
            const audioRef = useRef(null);
            const oscRef = useRef([]);

            const genres = [
                { id: 'doom-metal', name: 'Doom Metal', icon: '🎸', lyrics: 'Psychedelic, marijuana, horror. Electric Wizard style.' },
                { id: 'industrial', name: 'Industrial', icon: '⚙️', lyrics: 'Self-reflecting, harsh. Nine Inch Nails - rage, control.' },
                { id: 'dungeon-synth', name: 'Dungeon Synth', icon: '🏰', lyrics: 'Fantasy, magic. Lord of the Rings inspired.' }
            ];

            const keys = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            const scales = ['minor', 'major', 'dorian', 'phrygian'];
            const themes = [
                { id: 'dark', name: 'Dark', class: 'theme-dark' },
                { id: 'doom', name: 'Doom', class: 'theme-doom' },
                { id: 'industrial', name: 'Industrial', class: 'theme-industrial' },
                { id: 'dungeon', name: 'Dungeon', class: 'theme-dungeon' }
            ];

            useEffect(() => {
                const saved = localStorage.getItem('midi-projects');
                if (saved) setProjects(JSON.parse(saved));
                const savedTheme = localStorage.getItem('midi-theme') || 'dark';
                setTheme(savedTheme);
                document.body.className = themes.find(t => t.id === savedTheme)?.class || 'theme-dark';
            }, []);

            useEffect(() => {
                document.body.className = themes.find(t => t.id === theme)?.class || 'theme-dark';
                localStorage.setItem('midi-theme', theme);
            }, [theme]);

            const generate = async () => {
                if (!prompt) { setError('Enter a prompt'); return; }
                setLoading(true);
                setError('');
                setSong(null);
                try {
                    const g = genres.find(x => x.id === genre);
                    const res = await fetch('/api/generate-song', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            genre, bpm, 
                            prompt: `${prompt}\n\nKey: ${key} ${scale}\nLyrics theme: ${g.lyrics}` 
                        })
                    });
                    if (!res.ok) throw new Error('Generation failed');
                    const data = await res.json();
                    setSong(data.song);
                    const init = {};
                    const dyn = {};
                    data.song.sections?.forEach((sec, si) => {
                        init[si] = {};
                        sec.stems?.forEach((_, sti) => {
                            init[si][sti] = true;
                            dyn[`${si}-${sti}`] = 1;
                        });
                    });
                    setSelected(init);
                    setDynamics(dyn);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const save = () => {
                const name = prompt('Project name:', song?.title || 'My Song');
                if (!name) return;
                const proj = { name, date: new Date().toISOString(), genre, bpm, key, scale, prompt, song, dynamics };
                const all = [...projects, proj];
                setProjects(all);
                localStorage.setItem('midi-projects', JSON.stringify(all));
            };

            const load = (p) => {
                setGenre(p.genre);
                setBpm(p.bpm);
                setKey(p.key);
                setScale(p.scale);
                setPrompt(p.prompt);
                setSong(p.song);
                setDynamics(p.dynamics || {});
                setShowProjects(false);
            };

            const del = (i) => {
                if (!confirm('Delete?')) return;
                const all = projects.filter((_, idx) => idx !== i);
                setProjects(all);
                localStorage.setItem('midi-projects', JSON.stringify(all));
            };

            const noteToMidi = (note) => {
                const notes = { 'C': 0, 'C#': 1, 'D': 2, 'D#': 3, 'E': 4, 'F': 5, 'F#': 6, 'G': 7, 'G#': 8, 'A': 9, 'A#': 10, 'B': 11 };
                const m = note.match(/([A-G]#?)(\d)/);
                if (!m) return 60;
                return (parseInt(m[2]) + 1) * 12 + notes[m[1]];
            };

            const createMidi = (stems) => {
                const header = new Uint8Array([0x4D, 0x54, 0x68, 0x64, 0, 0, 0, 6, 0, 1, 0, stems.length, 1, 0xE0]);
                const tracks = stems.map(stem => {
                    const events = [];
                    const tpb = 480;
                    const nameBytes = new TextEncoder().encode(stem.instrument || '');
                    events.push([0, 0xFF, 0x03, nameBytes.length, ...nameBytes]);
                    const mpb = Math.round(60000000 / bpm);
                    events.push([0, 0xFF, 0x51, 3, (mpb >> 16) & 0xFF, (mpb >> 8) & 0xFF, mpb & 0xFF]);
                    stem.notes.forEach(n => {
                        const st = Math.round(n.time * tpb);
                        const dur = Math.round(n.duration * tpb);
                        const m = noteToMidi(n.pitch);
                        events.push([st, 0x90, m, n.velocity || 100]);
                        events.push([st + dur, 0x80, m, 0]);
                    });
                    events.sort((a, b) => a[0] - b[0]);
                    let last = 0;
                    const delta = events.map(e => {
                        const d = e[0] - last;
                        last = e[0];
                        return [d, ...e.slice(1)];
                    });
                    delta.push([0, 0xFF, 0x2F, 0]);
                    const tb = [];
                    delta.forEach(e => {
                        const enc = (v) => {
                            const b = [];
                            b.push(v & 0x7F);
                            v >>= 7;
                            while (v > 0) {
                                b.unshift((v & 0x7F) | 0x80);
                                v >>= 7;
                            }
                            return b;
                        };
                        tb.push(...enc(e[0]), ...e.slice(1));
                    });
                    const res = new Uint8Array(8 + tb.length);
                    res.set([0x4D, 0x54, 0x72, 0x6B], 0);
                    const len = tb.length;
                    res.set([len >> 24, (len >> 16) & 0xFF, (len >> 8) & 0xFF, len & 0xFF], 4);
                    res.set(tb, 8);
                    return res;
                });
                return new Blob([header, ...tracks], { type: 'audio/midi' });
            };

            const download = (stems, name) => {
                const blob = createMidi(stems);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${name.replace(/[^a-z0-9]/gi, '_')}.mid`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const waveform = (notes) => {
                const bars = [];
                const max = 40;
                const step = Math.ceil(notes.length / max);
                for (let i = 0; i < notes.length; i += step) {
                    const h = ((notes[i].velocity || 100) / 127) * 100;
                    bars.push(<div key={i} className="waveform-bar" style={{height: `${h}%`}} />);
                }
                return bars;
            };

            return (
                <div className="min-h-screen p-4 sm:p-8">
                    <div className="max-w-7xl mx-auto">
                        <div className="text-center mb-8">
                            <h1 className="text-5xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent mb-2">
                                Dark MIDI Generator
                            </h1>
                            <p className="text-gray-300">Ultimate Edition</p>
                            <div className="flex justify-center gap-2 mt-4 flex-wrap">
                                {themes.map(t => (
                                    <button key={t.id} onClick={() => setTheme(t.id)}
                                        className={`px-3 py-1 rounded-lg text-sm ${theme === t.id ? 'bg-purple-600' : 'bg-gray-700'}`}>
                                        {t.name}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="bg-gray-900/50 rounded-2xl p-6 border border-purple-500/20 mb-6">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                {genres.map(g => (
                                    <button key={g.id} onClick={() => setGenre(g.id)}
                                        className={`p-4 rounded-xl border-2 ${genre === g.id ? 'border-purple-500 bg-purple-900/30' : 'border-gray-700'}`}>
                                        <div className="text-3xl mb-1">{g.icon}</div>
                                        <div className="font-bold">{g.name}</div>
                                    </button>
                                ))}
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                <div>
                                    <label className="block text-sm mb-2">Key</label>
                                    <select value={key} onChange={e => setKey(e.target.value)}
                                        className="w-full px-3 py-2 bg-gray-800 rounded-lg">
                                        {keys.map(k => <option key={k}>{k}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm mb-2">Scale</label>
                                    <select value={scale} onChange={e => setScale(e.target.value)}
                                        className="w-full px-3 py-2 bg-gray-800 rounded-lg">
                                        {scales.map(s => <option key={s}>{s}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm mb-2">BPM: {bpm}</label>
                                    <input type="range" min="40" max="180" value={bpm} onChange={e => setBpm(parseInt(e.target.value))}
                                        className="w-full" />
                                </div>
                            </div>

                            <textarea value={prompt} onChange={e => setPrompt(e.target.value)}
                                placeholder={`${genres.find(g => g.id === genre)?.lyrics}\n\nCreate intro, verse, chorus, solo, outro. Add vocal melody with lyrics.`}
                                className="w-full h-32 px-4 py-3 bg-gray-800 rounded-xl mb-4" />

                            {error && <div className="bg-red-900/30 border border-red-500 rounded-lg p-3 mb-4 text-sm">{error}</div>}

                            <div className="grid grid-cols-2 gap-3">
                                <button onClick={generate} disabled={loading}
                                    className="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 disabled:from-gray-700 disabled:to-gray-700 py-3 rounded-xl font-bold flex items-center justify-center gap-2">
                                    {loading ? <Loader2 className="w-5 h-5" /> : <Music className="w-5 h-5" />}
                                    Generate
                                </button>
                                <button onClick={() => setShowProjects(!showProjects)}
                                    className="bg-blue-600 hover:bg-blue-700 py-3 rounded-xl font-bold flex items-center justify-center gap-2">
                                    <Save className="w-5 h-5" />Projects
                                </button>
                            </div>
                        </div>

                        {showProjects && (
                            <div className="bg-gray-900/50 rounded-2xl p-6 border border-purple-500/20 mb-6">
                                <div className="flex justify-between mb-4">
                                    <h3 className="text-xl font-bold">Saved Projects</h3>
                                    {song && <button onClick={save} className="bg-green-600 px-4 py-2 rounded-lg text-sm">Save Current</button>}
                                </div>
                                {projects.length === 0 ? (
                                    <p className="text-gray-400">No projects</p>
                                ) : (
                                    <div className="space-y-2">
                                        {projects.map((p, i) => (
                                            <div key={i} className="bg-gray-800 p-3 rounded-lg flex justify-between items-center">
                                                <div>
                                                    <div className="font-semibold">{p.name}</div>
                                                    <div className="text-xs text-gray-400">{p.genre} • {p.bpm} BPM • {p.key} {p.scale}</div>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => load(p)} className="bg-purple-600 px-3 py-1 rounded text-sm">Load</button>
                                                    <button onClick={() => del(i)} className="bg-red-600 px-3 py-1 rounded text-sm">Delete</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {song && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-br from-purple-900/50 to-pink-900/50 rounded-2xl p-6 border border-purple-500/30">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-3xl font-bold">{song.title}</h2>
                                        <div className="flex gap-3">
                                            <button onClick={() => playing === 'full' ? setPlaying(null) : setPlaying('full')}
                                                className="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-xl flex items-center gap-2">
                                                {playing === 'full' ? <><Pause className="w-5 h-5" />Stop</> : <><Play className="w-5 h-5" />Play Full</>}
                                            </button>
                                            <button onClick={() => download(song.sections.flatMap((s, i) => s.stems.map(st => ({...st, notes: st.notes.map(n => ({...n, time: n.time + (song.sections.slice(0,i).reduce((sum,sec) => sum + (sec.duration_beats||32), 0))}))}))), song.title)}
                                                className="bg-green-600 hover:bg-green-700 px-6 py-3 rounded-xl flex items-center gap-2">
                                                <Download className="w-5 h-5" />Download
                                            </button>
                                        </div>
                                    </div>
                                    <p className="text-gray-300">{song.sections?.length} sections • {bpm} BPM • {key} {scale}</p>
                                </div>

                                {song.sections?.map((sec, si) => (
                                    <div key={si} className="bg-gray-900/50 rounded-2xl p-6 border border-gray-700">
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <h3 className="text-2xl font-bold capitalize flex items-center gap-2">
                                                    {sec.name}
                                                    {sec.lyrics && <Mic className="w-5 h-5 text-pink-400" />}
                                                </h3>
                                                {sec.lyrics && (
                                                    <div className="mt-2 p-3 bg-pink-900/20 border border-pink-500/30 rounded-lg">
                                                        <p className="text-sm text-pink-200 italic whitespace-pre-line">{sec.lyrics}</p>
                                                    </div>
                                                )}
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => playing === si ? setPlaying(null) : setPlaying(si)}
                                                    className="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg flex items-center gap-2">
                                                    {playing === si ? <><Pause className="w-4 h-4" />Stop</> : <><Play className="w-4 h-4" />Play</>}
                                                </button>
                                                <button onClick={() => download(sec.stems, `${song.title}-${sec.name}`)}
                                                    className="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg flex items-center gap-2">
                                                    <Download className="w-4 h-4" />
                                                </button>
                                            </div>
                                        </div>

                                        <div className="space-y-3">
                                            {sec.stems?.map((stem, sti) => (
                                                <div key={sti} className="bg-gray-800/50 rounded-lg p-4">
                                                    <div className="flex justify-between items-center mb-2">
                                                        <div className="flex items-center gap-2">
                                                            {stem.instrument.toLowerCase().includes('vocal') && <Mic className="w-4 h-4 text-pink-400" />}
                                                            <span className="font-semibold text-sm">{stem.instrument}</span>
                                                        </div>
                                                        <span className="text-xs text-gray-400">{stem.notes?.length} notes</span>
                                                    </div>
                                                    <div className="waveform bg-gray-900 rounded-lg mb-2">
                                                        {stem.notes && waveform(stem.notes)}
                                                    </div>
                                                    <div className="flex items-center gap-2">
                                                        <span className="text-xs w-16">Volume:</span>
                                                        <input type="range" min="0" max="2" step="0.1"
                                                            value={dynamics[`${si}-${sti}`] || 1}
                                                            onChange={e => setDynamics({...dynamics, [`${si}-${sti}`]: parseFloat(e.target.value)})}
                                                            className="flex-1" />
                                                        <span className="text-xs w-12">{Math.round(((dynamics[`${si}-${sti}`] || 1) * 100))}%</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
