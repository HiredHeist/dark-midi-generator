<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dark MIDI Generator - Pro Mode</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: linear-gradient(to bottom right, #1a1a2e, #16213e, #0f3460);
        }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { 
            background: linear-gradient(to bottom, #a855f7, #ec4899);
            border-radius: 5px;
        }
        input[type="range"] { -webkit-appearance: none; appearance: none; }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }
        .glow { box-shadow: 0 0 20px rgba(168, 85, 247, 0.3); }
        .glow-strong { box-shadow: 0 0 30px rgba(168, 85, 247, 0.6); }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // Icons
        const Music = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
            </svg>
        );

        const Play = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
            </svg>
        );

        const Pause = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 9v6m4-6v6" />
            </svg>
        );

        const Download = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
        );

        const RotateCw = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
        );

        const Loader2 = ({ className = "w-6 h-6" }) => (
            <svg className={className + " animate-spin"} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
            </svg>
        );

        const Mic = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
            </svg>
        );

        function DarkMIDIGenerator() {
            const [genre, setGenre] = useState('doom-metal');
            const [bpm, setBpm] = useState(80);
            const [prompt, setPrompt] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [song, setSong] = useState(null);
            const [error, setError] = useState('');
            const [playingSection, setPlayingSection] = useState(null);
            const [isPlayingFull, setIsPlayingFull] = useState(false);
            const [remakingSection, setRemakingSection] = useState(null);
            const [selectedInstruments, setSelectedInstruments] = useState({});
            
            const audioContextRef = useRef(null);
            const oscillatorsRef = useRef([]);

            const genres = [
                { id: 'doom-metal', name: 'Doom Metal', description: 'Heavy, slow riffs', icon: '🎸', gradient: 'from-red-900 to-black' },
                { id: 'industrial', name: 'Industrial', description: 'Mechanical rhythms', icon: '⚙️', gradient: 'from-gray-800 to-gray-900' },
                { id: 'dungeon-synth', name: 'Dungeon Synth', description: 'Dark medieval', icon: '🏰', gradient: 'from-purple-900 to-indigo-950' }
            ];

            // MIDI/Audio functions
            const noteToMidi = (note) => {
                const notes = { 'C': 0, 'C#': 1, 'D': 2, 'D#': 3, 'E': 4, 'F': 5, 'F#': 6, 'G': 7, 'G#': 8, 'A': 9, 'A#': 10, 'B': 11 };
                const match = note.match(/([A-G]#?)(\d)/);
                if (!match) return 60;
                const [, noteName, octave] = match;
                return (parseInt(octave) + 1) * 12 + notes[noteName];
            };

            const midiToFrequency = (midi) => 440 * Math.pow(2, (midi - 69) / 12);

            const initAudioContext = () => {
                if (!audioContextRef.current) {
                    audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)();
                }
                return audioContextRef.current;
            };

            const playNote = (frequency, startTime, duration, velocity, instrumentName) => {
                const audioContext = audioContextRef.current;
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                const name = instrumentName.toLowerCase();
                if (name.includes('bass')) oscillator.type = 'sawtooth';
                else if (name.includes('guitar') || name.includes('riff')) oscillator.type = 'square';
                else if (name.includes('vocal') || name.includes('melody')) oscillator.type = 'sine';
                else if (name.includes('pad') || name.includes('synth')) oscillator.type = 'sine';
                else oscillator.type = 'triangle';
                
                oscillator.frequency.setValueAtTime(frequency, startTime);
                
                const normalizedVelocity = (velocity || 100) / 127;
                gainNode.gain.setValueAtTime(0, startTime);
                gainNode.gain.linearRampToValueAtTime(normalizedVelocity * 0.3, startTime + 0.01);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + duration);
                
                return { oscillator, gainNode };
            };

            const playSection = (section, sectionIndex) => {
                stopPlayback();
                const audioContext = initAudioContext();
                const currentAudioTime = audioContext.currentTime;
                const beatsPerSecond = bpm / 60;
                
                oscillatorsRef.current = [];
                setPlayingSection(sectionIndex);
                
                section.stems?.forEach(stem => {
                    stem.notes?.forEach(note => {
                        const startTime = currentAudioTime + (note.time / beatsPerSecond);
                        const duration = note.duration / beatsPerSecond;
                        const frequency = midiToFrequency(noteToMidi(note.pitch));
                        
                        const nodes = playNote(frequency, startTime, duration, note.velocity, stem.instrument);
                        if (nodes) oscillatorsRef.current.push(nodes);
                    });
                });
                
                const sectionDuration = (section.duration_beats || 32) / beatsPerSecond;
                setTimeout(() => {
                    stopPlayback();
                }, sectionDuration * 1000);
            };

            const playFullSong = () => {
                stopPlayback();
                const audioContext = initAudioContext();
                let currentBeat = 0;
                const beatsPerSecond = bpm / 60;
                
                oscillatorsRef.current = [];
                setIsPlayingFull(true);
                
                song.sections?.forEach(section => {
                    section.stems?.forEach(stem => {
                        stem.notes?.forEach(note => {
                            const startTime = audioContext.currentTime + ((currentBeat + note.time) / beatsPerSecond);
                            const duration = note.duration / beatsPerSecond;
                            const frequency = midiToFrequency(noteToMidi(note.pitch));
                            
                            const nodes = playNote(frequency, startTime, duration, note.velocity, stem.instrument);
                            if (nodes) oscillatorsRef.current.push(nodes);
                        });
                    });
                    currentBeat += section.duration_beats || 32;
                });
                
                const totalDuration = currentBeat / beatsPerSecond;
                setTimeout(() => {
                    stopPlayback();
                }, totalDuration * 1000);
            };

            const stopPlayback = () => {
                oscillatorsRef.current.forEach(({ oscillator }) => {
                    try { oscillator.stop(); } catch (e) {}
                });
                oscillatorsRef.current = [];
                setPlayingSection(null);
                setIsPlayingFull(false);
            };

            const generateSong = async () => {
                if (!prompt.trim()) {
                    setError('Please enter a prompt describing your song');
                    return;
                }

                setIsGenerating(true);
                setError('');
                setSong(null);
                stopPlayback();

                try {
                    const response = await fetch('/api/generate-song', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ genre, bpm, prompt })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || 'Failed to generate song');
                    }

                    const data = await response.json();
                    setSong(data.song);
                    
                    // Initialize selected instruments (all checked by default)
                    const initialSelected = {};
                    data.song.sections?.forEach((section, sIdx) => {
                        initialSelected[sIdx] = {};
                        section.stems?.forEach((stem, stemIdx) => {
                            initialSelected[sIdx][stemIdx] = true;
                        });
                    });
                    setSelectedInstruments(initialSelected);

                } catch (err) {
                    setError(err.message || 'Failed to generate song');
                } finally {
                    setIsGenerating(false);
                }
            };

            const remakeSection = async (sectionIndex) => {
                setRemakingSection(sectionIndex);
                stopPlayback();
                
                try {
                    const section = song.sections[sectionIndex];
                    const selectedStems = Object.entries(selectedInstruments[sectionIndex] || {})
                        .filter(([idx, selected]) => selected)
                        .map(([idx]) => section.stems[parseInt(idx)].instrument);
                    
                    const response = await fetch('/api/remake-section', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            genre,
                            bpm,
                            prompt,
                            sectionName: section.name,
                            instruments: selectedStems,
                            durationBeats: section.duration_beats
                        })
                    });

                    if (!response.ok) throw new Error('Failed to remake section');

                    const data = await response.json();
                    
                    setSong(prev => {
                        const newSong = { ...prev };
                        newSong.sections = [...prev.sections];
                        newSong.sections[sectionIndex] = data.section;
                        return newSong;
                    });

                } catch (err) {
                    setError(`Failed to remake section: ${err.message}`);
                } finally {
                    setRemakingSection(null);
                }
            };

            const toggleInstrument = (sectionIndex, stemIndex) => {
                setSelectedInstruments(prev => ({
                    ...prev,
                    [sectionIndex]: {
                        ...(prev[sectionIndex] || {}),
                        [stemIndex]: !(prev[sectionIndex]?.[stemIndex] ?? true)
                    }
                }));
            };

            const createMIDIFile = (stems, bpm) => {
                const header = new Uint8Array([0x4D, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06, 0x00, 0x01, 0x00, stems.length, 0x01, 0xE0]);
                const tracks = stems.map(stem => {
                    const events = [];
                    const ticksPerBeat = 480;
                    const nameBytes = new TextEncoder().encode(stem.instrument || stem.name);
                    events.push([0x00, 0xFF, 0x03, nameBytes.length, ...nameBytes]);
                    const microsecondsPerBeat = Math.round(60000000 / bpm);
                    events.push([0x00, 0xFF, 0x51, 0x03, (microsecondsPerBeat >> 16) & 0xFF, (microsecondsPerBeat >> 8) & 0xFF, microsecondsPerBeat & 0xFF]);
                    stem.notes.forEach(note => {
                        const startTick = Math.round(note.time * ticksPerBeat);
                        const duration = Math.round(note.duration * ticksPerBeat);
                        const midi = noteToMidi(note.pitch);
                        events.push([startTick, 0x90, midi, note.velocity || 100]);
                        events.push([startTick + duration, 0x80, midi, 0]);
                    });
                    events.sort((a, b) => a[0] - b[0]);
                    let lastTime = 0;
                    const deltaEvents = events.map(event => {
                        const deltaTime = event[0] - lastTime;
                        lastTime = event[0];
                        return [deltaTime, ...event.slice(1)];
                    });
                    deltaEvents.push([0x00, 0xFF, 0x2F, 0x00]);
                    const trackBytes = [];
                    deltaEvents.forEach(event => {
                        const encodeVarLen = (value) => {
                            const bytes = [];
                            bytes.push(value & 0x7F);
                            value >>= 7;
                            while (value > 0) {
                                bytes.unshift((value & 0x7F) | 0x80);
                                value >>= 7;
                            }
                            return bytes;
                        };
                        trackBytes.push(...encodeVarLen(event[0]));
                        trackBytes.push(...event.slice(1));
                    });
                    const result = new Uint8Array(8 + trackBytes.length);
                    result.set([0x4D, 0x54, 0x72, 0x6B], 0);
                    const len = trackBytes.length;
                    result.set([len >> 24, (len >> 16) & 0xFF, (len >> 8) & 0xFF, len & 0xFF], 4);
                    result.set(trackBytes, 8);
                    return result;
                });
                return new Blob([header, ...tracks], { type: 'audio/midi' });
            };

            const downloadSection = (section) => {
                const midiBlob = createMIDIFile(section.stems, bpm);
                const url = URL.createObjectURL(midiBlob);
                const a = document.createElement('a');
                a.href = url;
                const title = song.title.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                a.download = `${title}-${section.name}.mid`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const downloadFullSong = () => {
                const allStems = [];
                let currentBeat = 0;
                song.sections.forEach(section => {
                    section.stems.forEach(stem => {
                        const adjustedStem = {
                            ...stem,
                            notes: stem.notes.map(note => ({ ...note, time: note.time + currentBeat }))
                        };
                        allStems.push(adjustedStem);
                    });
                    currentBeat += section.duration_beats || 32;
                });
                const midiBlob = createMIDIFile(allStems, bpm);
                const url = URL.createObjectURL(midiBlob);
                const a = document.createElement('a');
                a.href = url;
                const title = song.title.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                a.download = `${title}-full.mid`;
                a.click();
                URL.revokeObjectURL(url);
            };

            return (
                <div className="min-h-screen text-gray-100 p-4 sm:p-8">
                    <div className="max-w-7xl mx-auto">
                        {/* Header */}
                        <div className="text-center mb-8">
                            <div className="flex items-center justify-center gap-3 mb-4">
                                <Music className="w-12 h-12 sm:w-16 sm:h-16 text-purple-400 animate-pulse-slow" />
                                <h1 className="text-4xl sm:text-6xl font-bold bg-gradient-to-r from-purple-400 via-pink-400 to-purple-400 bg-clip-text text-transparent">
                                    Dark MIDI Generator Pro
                                </h1>
                            </div>
                            <p className="text-lg sm:text-xl text-gray-300">Create • Preview • Remix</p>
                            <p className="text-sm text-purple-400 mt-2">Full playback • Section remix • Instrument selection • Vocal melodies</p>
                        </div>

                        {/* Generation Form */}
                        <div className="bg-gray-900/50 backdrop-blur-sm rounded-2xl p-6 sm:p-8 shadow-2xl border border-purple-500/20 glow mb-8">
                            <div className="mb-6">
                                <label className="block text-sm font-semibold mb-4 text-purple-300">Genre</label>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {genres.map(g => (
                                        <button key={g.id} onClick={() => setGenre(g.id)}
                                            className={`p-6 rounded-xl border-2 transition-all ${genre === g.id ? 'border-purple-500 bg-gradient-to-br ' + g.gradient + ' glow-strong scale-105' : 'border-gray-700 bg-gray-800/50 hover:border-purple-500/50'}`}>
                                            <div className="text-4xl mb-2">{g.icon}</div>
                                            <div className="font-bold text-lg mb-1">{g.name}</div>
                                            <div className="text-xs text-gray-400">{g.description}</div>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="mb-6">
                                <label className="block text-sm font-semibold mb-4 text-purple-300">
                                    BPM: <span className="text-white text-2xl ml-2 font-mono">{bpm}</span>
                                </label>
                                <input type="range" min="40" max="180" value={bpm} onChange={(e) => setBpm(parseInt(e.target.value))}
                                    className="w-full h-3 bg-gray-700 rounded-lg appearance-none cursor-pointer" />
                            </div>

                            <div className="mb-6">
                                <label className="block text-sm font-semibold mb-3 text-purple-300">Describe Your Song</label>
                                <textarea value={prompt} onChange={(e) => setPrompt(e.target.value)}
                                    placeholder="e.g., Heavy doom metal with crushing riffs and dark atmosphere. Include intro, verse, chorus, bridge, solo, outro. Add vocal melody for haunting lyrics about darkness."
                                    className="w-full h-40 px-4 py-3 bg-gray-800/50 border border-gray-700 rounded-xl focus:outline-none focus:border-purple-500 text-white placeholder-gray-500 text-sm" />
                            </div>

                            {error && (
                                <div className="bg-red-900/30 border border-red-500 rounded-xl p-4 flex items-start gap-3 mb-6">
                                    <span className="text-sm text-red-200">{error}</span>
                                </div>
                            )}

                            <button onClick={generateSong} disabled={isGenerating}
                                className="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 disabled:from-gray-700 disabled:to-gray-700 text-white font-bold py-5 rounded-xl transition-all flex items-center justify-center gap-3 text-lg glow-strong">
                                {isGenerating ? <><Loader2 className="w-6 h-6" />Generating...</> : <><Music className="w-6 h-6" />Generate Complete Song</>}
                            </button>
                        </div>

                        {/* Generated Song */}
                        {song && (
                            <div className="space-y-6">
                                {/* Song Header with Full Playback */}
                                <div className="bg-gradient-to-br from-purple-900/50 to-pink-900/50 backdrop-blur-sm rounded-2xl p-6 sm:p-8 shadow-2xl border border-purple-500/30 glow">
                                    <div className="flex items-center justify-between flex-wrap gap-4 mb-6">
                                        <div>
                                            <h2 className="text-3xl sm:text-4xl font-bold bg-gradient-to-r from-purple-300 to-pink-300 bg-clip-text text-transparent">
                                                {song.title}
                                            </h2>
                                            <p className="text-gray-400 mt-2">{song.sections?.length || 0} sections • {bpm} BPM</p>
                                        </div>
                                        <div className="flex gap-3">
                                            <button onClick={isPlayingFull ? stopPlayback : playFullSong}
                                                className="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl flex items-center gap-2 transition-all glow font-semibold">
                                                {isPlayingFull ? <><Pause className="w-5 h-5" />Stop</> : <><Play className="w-5 h-5" />Play Full Song</>}
                                            </button>
                                            <button onClick={downloadFullSong}
                                                className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl flex items-center gap-2 transition-all glow font-semibold">
                                                <Download className="w-5 h-5" />Download
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* Sections with Playback & Remake */}
                                {song.sections?.map((section, sIdx) => (
                                    <div key={sIdx} className="bg-gray-900/50 backdrop-blur-sm rounded-2xl p-6 shadow-2xl border border-gray-700 hover:border-purple-500/50 transition-all">
                                        <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
                                            <div>
                                                <h3 className="text-2xl font-bold text-purple-300 capitalize flex items-center gap-2">
                                                    {section.name}
                                                    {section.stems?.some(s => s.instrument.toLowerCase().includes('vocal')) && <Mic className="w-5 h-5 text-pink-400" />}
                                                </h3>
                                                <p className="text-sm text-gray-400">{section.duration_beats || 'N/A'} beats • {section.stems?.length || 0} instruments</p>
                                                {section.lyrics && <p className="text-xs text-pink-300 mt-1 italic">"{section.lyrics}"</p>}
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => playingSection === sIdx ? stopPlayback() : playSection(section, sIdx)}
                                                    className="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-all">
                                                    {playingSection === sIdx ? <><Pause className="w-4 h-4" />Stop</> : <><Play className="w-4 h-4" />Play</>}
                                                </button>
                                                <button onClick={() => remakeSection(sIdx)} disabled={remakingSection === sIdx}
                                                    className="bg-orange-600 hover:bg-orange-700 disabled:bg-gray-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-all">
                                                    {remakingSection === sIdx ? <Loader2 className="w-4 h-4" /> : <RotateCw className="w-4 h-4" />}
                                                    Remix
                                                </button>
                                                <button onClick={() => downloadSection(section)}
                                                    className="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-all">
                                                    <Download className="w-4 h-4" />
                                                </button>
                                            </div>
                                        </div>

                                        {/* Instrument Selection */}
                                        <div className="mb-4 bg-gray-800/30 rounded-lg p-4">
                                            <p className="text-sm text-gray-400 mb-3">Select instruments to remix:</p>
                                            <div className="flex flex-wrap gap-3">
                                                {section.stems?.map((stem, stemIdx) => (
                                                    <label key={stemIdx} className="flex items-center gap-2 bg-gray-800 px-3 py-2 rounded-lg cursor-pointer hover:bg-gray-700 transition-all">
                                                        <input type="checkbox" checked={selectedInstruments[sIdx]?.[stemIdx] ?? true}
                                                            onChange={() => toggleInstrument(sIdx, stemIdx)}
                                                            className="w-4 h-4 accent-purple-500" />
                                                        <span className="text-sm">{stem.instrument}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Instrument Grid */}
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                                            {section.stems?.map((stem, stemIdx) => (
                                                <div key={stemIdx} className="bg-gray-800/50 rounded-lg p-4 border border-gray-700">
                                                    <div className="flex items-center gap-2 mb-1">
                                                        {stem.instrument.toLowerCase().includes('vocal') && <Mic className="w-4 h-4 text-pink-400" />}
                                                        <div className="font-semibold text-purple-200 truncate text-sm">{stem.instrument}</div>
                                                    </div>
                                                    <div className="text-xs text-gray-400">{stem.notes?.length || 0} notes</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<DarkMIDIGenerator />, document.getElementById('root'));
    </script>
</body>
</html>
